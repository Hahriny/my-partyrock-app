<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repo Test Page</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #ffe082, #ff8a80, #80d8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 40px 48px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 460px;
    }
    h1 { color: #e65100; margin: 0 0 10px; }
    .check { font-size: 3rem; }
    code {
      background: #f0f0f0;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #c62828;
    }
    p { color: #444; line-height: 1.6; }
    .time { color: #888; font-size: 0.85rem; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅🌟</div>
    <h1>Repo Test Successful!</h1>
    <p>
      If you can see this page on GitHub, then this folder is connected to the
      <strong>correct repository</strong>.
    </p>
    <p>
      This file was created to confirm the connection between your local project
      <code>Learning Steps For Autistic Kids Kiro</code> and your GitHub repo.
    </p>
    <p class="time">Test file created: October 2026</p>
  </div>
</body>
</html>
